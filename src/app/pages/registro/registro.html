<div class="registro-container">
  <h2>📝 Registro de Usuario</h2>
  <p class="subtitle">Completá tus datos para obtener un 20% de descuento en tu primera compra y sumar puntos</p>

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="form-grid">
    
    <div class="form-group">
      <label>Email *</label>
      <input type="email" formControlName="email" placeholder="ejemplo@mail.com">
    </div>

    <div class="form-group">
      <label>Contraseña *</label>
      <input type="password" formControlName="password" placeholder="Mínimo 6 caracteres">
    </div>

    <div class="form-group">
      <label>Nombre *</label>
      <input type="text" formControlName="nombre" placeholder="Tu nombre">
    </div>

    <div class="form-group">
      <label>Apellido *</label>
      <input type="text" formControlName="apellido" placeholder="Tu apellido">
    </div>

    <div class="form-group">
      <label>Fecha de Nacimiento *</label>
      <input type="date" formControlName="fechaNacimiento">
    </div>

    <div class="form-group">
      <label>Tipo de Sangre *</label>
      <select formControlName="tipoSangre">
        <option value="">Seleccionar...</option>
        @for (tipo of tiposSangre; track tipo) {
        <option [value]="tipo">{{ tipo }}</option>}      
      </select>
    </div>

    <div class="form-group">
      <label>Color de Ojos *</label>
      <input type="text" formControlName="colorOjos" placeholder="Ej: Marrón, Verde, Azul">
    </div>

    <div class="form-group">
      <label>Días de vacaciones al año *</label>
      <input type="number" formControlName="diasVacaciones" min="0">
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="registroForm.invalid" class="btn-submit">Registrarse</button>
      <p>¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión aquí</a></p>
    </div>

  </form>

    @if (mensajeError) {
  <p class="error-msg">{{ mensajeError }}</p>}
</div>
